<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>CALA VERDE — Puerto Azul</title>
<link rel="stylesheet" href="./src/ui.css" />
</head>
<body>
  <div id="app">
    <canvas id="scene"></canvas>
    <div id="vignette"></div>
    <div id="hud"></div>

    <div id="title-screen" class="screen"><div class="title-panel"></div></div>
    <div id="pause-menu" class="screen" hidden></div>
    <div id="map-screen" class="screen" hidden></div>
    <div id="settings-screen" class="screen" hidden></div>
    <div id="end-card" class="screen" hidden></div>

    <div id="controls-card" hidden>
      <div class="cc-panel">
        <div class="cc-kicker">PRIMERA VEZ</div>
        <h3 class="cc-title">CÓMO SE JUEGA</h3>
        <div class="cc-grid">
          <span><b>WASD</b> moverse</span>
          <span><b>RATÓN</b> cámara</span>
          <span><b>SHIFT</b> esprintar</span>
          <span><b>ESPACIO</b> saltar</span>
          <span><b>CLIC IZQ</b> disparar</span>
          <span><b>CLIC DER</b> apuntar</span>
          <span><b>F</b> coche</span>
          <span><b>T</b> teléfono</span>
          <span><b>R</b> recargar</span>
          <span><b>1 2 3</b> armas</span>
          <span><b>M</b> misión</span>
          <span><b>ESC</b> pausa</span>
        </div>
        <button type="button" id="controls-dismiss">ENTENDIDO</button>
      </div>
    </div>
  </div>
  <pre id="selftest" hidden></pre>
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.min.js" } }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
